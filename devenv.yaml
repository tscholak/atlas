inputs:
  # graham33's overlay carries the DGX-Spark CUDA stack: cudaPackages_13_2,
  # cudaCapabilities = [ "12.1" ] for sm_121 (GB10 Blackwell), and the
  # autoAddDriverRunpath plumbing. Atlas links against this exact stack
  # via heim's `packages/atlas/default.nix`; using the same overlay here
  # keeps the dev binary ABI-identical to the production build.
  #
  # Layout note: nixpkgs is at top level (so devenv's `nixpkgs.config`
  # below applies to it); dgx-spark FOLLOWS our nixpkgs (so its overlay
  # plugs into our configured nixpkgs rather than its own). Otherwise
  # `follows: dgx-spark/nixpkgs` would give us dgx-spark's already-
  # imported nixpkgs with its default config, and our allowUnfree never
  # takes effect for the cuda packages.
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  dgx-spark:
    url: github:graham33/nixos-dgx-spark
    overlays:
    - fixes
    inputs:
      nixpkgs:
        follows: nixpkgs
nixpkgs:
  config:
    allowUnfree: true
    cudaSupport: true
